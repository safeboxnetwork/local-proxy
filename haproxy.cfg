global
  log stdout format raw local0 info
  maxconn 4096
  # the container is stopped with SIGUSR1 (see STOPSIGNAL in the Dockerfile);
  # bound the graceful drain so the process always exits in a timely manner
  hard-stop-after 30s

defaults
  mode http
  log global
  option redispatch
  retries 3
  timeout connect 5s
  timeout client 24h
  timeout server 24h
  timeout queue 30s
  option srvtcpka
  option clitcpka

frontend default
  bind :80 $BIND_PROXY_PROTOCOL
  option httplog
  option dontlognull
  option forwardfor
  http-request set-header X-Forwarded-Proto http
  timeout http-request 10s
  timeout http-keep-alive 1m

  acl letsencrypt path_beg /.well-known/acme-challenge/
  use_backend letsencrypt if letsencrypt

  default_backend backend-default

backend letsencrypt
  timeout http-request 10s
  timeout http-keep-alive 1m
  server letsencrypt $letsencrypt:80 send-proxy

backend backend-default
  balance roundrobin
  option log-health-checks
  timeout http-request 10s
  timeout http-keep-alive 1m
  server backend-1 smarthostbackend-1:80 check send-proxy
  server backend-2 smarthostbackend-2:80 check send-proxy

frontend default_https
  bind :443 $BIND_PROXY_PROTOCOL
  mode tcp
  option tcplog
  option dontlognull

  default_backend backend_default_https

backend backend_default_https
  mode tcp
  option log-health-checks
  balance roundrobin
  server backend-1 smarthostbackend-1:443 check send-proxy
  server backend-2 smarthostbackend-2:443 check send-proxy
